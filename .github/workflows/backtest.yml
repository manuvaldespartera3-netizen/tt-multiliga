name: Backtest multiliga

on:
  workflow_dispatch:
    inputs:
      liga:
        description: "Liga a analizar"
        type: choice
        default: "Las 3"
        options:
          - "Las 3"
          - "TT Cup"
          - "Czech Liga Pro"
          - "TT Elite Series"
      dias:
        description: "Dias a analizar"
        default: "180"

permissions:
  contents: write

concurrency:
  group: backtest
  cancel-in-progress: false

jobs:
  preparar:
    runs-on: ubuntu-latest
    outputs:
      ligas: ${{ steps.m.outputs.ligas }}
    steps:
      - id: m
        run: |
          TT='{"id":"15005","slug":"tt_cup"}'
          LP='{"id":"19039","slug":"czech_liga_pro"}'
          ES='{"id":"19041","slug":"tt_elite_series"}'
          case "${{ github.event.inputs.liga }}" in
            "TT Cup")          echo "ligas=[$TT]" >> $GITHUB_OUTPUT ;;
            "Czech Liga Pro")  echo "ligas=[$LP]" >> $GITHUB_OUTPUT ;;
            "TT Elite Series") echo "ligas=[$ES]" >> $GITHUB_OUTPUT ;;
            *)                 echo "ligas=[$TT,$LP,$ES]" >> $GITHUB_OUTPUT ;;
          esac

  backtest:
    needs: preparar
    runs-on: ubuntu-latest
    timeout-minutes: 350
    strategy:
      max-parallel: 1          # una liga detras de otra: no saturar la API del avisador
      fail-fast: false
      matrix:
        liga: ${{ fromJSON(needs.preparar.outputs.ligas) }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar numpy
        run: pip install numpy

      # lo ya descargado se guarda: si se corta, la siguiente vez sigue donde lo dejo
      - name: Recuperar descargas anteriores
        uses: actions/cache/restore@v4
        with:
          path: resultados/**/cache
          key: mb-${{ matrix.liga.slug }}-${{ github.run_id }}
          # TT Cup tambien aprovecha lo descargado en la primera prueba (clave "mb-<numero>")
          restore-keys: |
            mb-${{ matrix.liga.slug }}-
            ${{ matrix.liga.slug == 'tt_cup' && 'mb-' || 'mb-ninguna-' }}

      - name: Validar
        env:
          ZYLA_API_KEY: ${{ secrets.ZYLA_API_KEY }}
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          MY_CHAT_ID: ${{ secrets.MY_CHAT_ID }}
          LIGA: ${{ matrix.liga.id }}
          BT_DAYS: ${{ github.event.inputs.dias || '180' }}
          BT_PACE: "0.8"
          BT_MAX_MIN: "290"
        run: python mb_backtest.py

      - name: Guardar descargas
        if: always()
        uses: actions/cache/save@v4
        with:
          path: resultados/**/cache
          key: mb-${{ matrix.liga.slug }}-${{ github.run_id }}

      - name: Avisar si falla
        if: failure() || cancelled()
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          MY_CHAT_ID: ${{ secrets.MY_CHAT_ID }}
        run: |
          [ -n "$TELEGRAM_TOKEN" ] || exit 0
          curl -s "https://api.telegram.org/bot${TELEGRAM_TOKEN}/sendMessage" \
            --data-urlencode "chat_id=${MY_CHAT_ID}" \
            --data-urlencode "text=⚠️ La validación de ${{ matrix.liga.slug }} se ha cortado. Vuelve a lanzarla: seguirá donde lo dejó." > /dev/null

      - name: Guardar resultados en el repositorio
        if: always()
        run: |
          git config user.name "tt-multiliga"
          git config user.email "tt-multiliga@users.noreply.github.com"
          git add $(find resultados -path '*/cache' -prune -o -type f \( -name '*.txt' -o -name '*.csv' \) -print) 2>/dev/null || true
          git commit -m "Validacion ${{ matrix.liga.slug }} $(date +%F)" || echo "sin cambios"
          for i in 1 2 3; do git pull --rebase -X theirs && git push && break; sleep 5; done || true
