jobs:
  backtest:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Elegir liga
        run: |
          case "${{ github.event.inputs.liga }}" in
            "TT Cup")          echo "LIGA=15005" >> $GITHUB_ENV ;;
            "Czech Liga Pro")  echo "LIGA=19039" >> $GITHUB_ENV ;;
            "TT Elite Series") echo "LIGA=19041" >> $GITHUB_ENV ;;
            *)                 echo "LIGA=todas" >> $GITHUB_ENV ;;
          esac

      # lo ya descargado se guarda: si se corta, la siguiente vez sigue donde lo dejo
      - name: Recuperar descargas anteriores
        uses: actions/cache/restore@v4
        with:
          path: resultados/**/cache
          key: mb-${{ github.run_id }}
          restore-keys: mb-

      - name: Backtest
        env:
          ZYLA_API_KEY: ${{ secrets.ZYLA_API_KEY }}
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          MY_CHAT_ID: ${{ secrets.MY_CHAT_ID }}
          BT_DAYS: ${{ github.event.inputs.dias || '60' }}
        run: python mb_backtest.py

      - name: Guardar descargas
        if: always()
        uses: actions/cache/save@v4
        with:
          path: resultados/**/cache
          key: mb-${{ github.run_id }}

      - name: Avisar si falla
        if: failure() || cancelled()
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          MY_CHAT_ID: ${{ secrets.MY_CHAT_ID }}
        run: |
          [ -n "$TELEGRAM_TOKEN" ] || exit 0
          curl -s "https://api.telegram.org/bot${TELEGRAM_TOKEN}/sendMessage" \
            --data-urlencode "chat_id=${MY_CHAT_ID}" \
            --data-urlencode "text=⚠️ El backtest multiliga se ha cortado. Vuelve a lanzarlo: seguirá donde lo dejó." > /dev/null

      - name: Guardar resultados en el repositorio
        if: always()
        run: |
          git config user.name "tt-multiliga"
          git config user.email "tt-multiliga@users.noreply.github.com"
          git add $(find resultados -path '*/cache' -prune -o -type f \( -name '*.txt' -o -name '*.csv' \) -print) 2>/dev/null || true
          git commit -m "Resultados backtest $(date +%F)" || echo "sin cambios"
          git push || true
