name: Simulacion 12 meses TT Cup

# Simula 12 meses de la regla en caliente con datos y cuotas reales de BetsAPI.
# Se lanza a mano UNA vez por liga: si no le da tiempo, se relanza solo y sigue donde lo dejo.
on:
  workflow_dispatch:
    inputs:
      liga:
        description: "Liga"
        type: choice
        default: "TT Elite Series"
        options:
          - "TT Elite Series"
          - "Czech Liga Pro"
          - "TT Cup"
      vuelta:
        description: "Vuelta (dejar en 1)"
        default: "1"

permissions:
  contents: write
  actions: write      # para relanzarse si falta terminar

# una simulacion detras de otra (nunca dos a la vez: no gastar el cupo del bot)
concurrency:
  group: historico
  cancel-in-progress: false

jobs:
  simular:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - name: Elegir liga
        run: |
          case "${{ github.event.inputs.liga }}" in
            "TT Cup")          echo "LIGA_SIM=15005" >> $GITHUB_ENV; echo "SLUG=tt_cup" >> $GITHUB_ENV ;;
            "Czech Liga Pro")  echo "LIGA_SIM=19039" >> $GITHUB_ENV; echo "SLUG=czech_liga_pro" >> $GITHUB_ENV ;;
            *)                 echo "LIGA_SIM=19041" >> $GITHUB_ENV; echo "SLUG=tt_elite_series" >> $GITHUB_ENV ;;
          esac

      - uses: actions/checkout@v4
        with:
          ref: main

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar numpy
        run: pip install numpy

      # lo ya descargado se guarda: la siguiente vuelta sigue donde lo dejo
      - name: Recuperar descargas
        uses: actions/cache/restore@v4
        with:
          path: resultados_12m/${{ env.SLUG }}/cache
          key: h12c-${{ env.SLUG }}-${{ github.run_id }}
          restore-keys: |
            h12c-${{ env.SLUG }}-
            ${{ env.SLUG == 'tt_cup' && 'h12b-' || 'h12-ninguna-' }}

      - name: Simular
        env:
          BETSAPI_TOKEN: ${{ secrets.BETSAPI_TOKEN }}
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          MY_CHAT_ID: ${{ secrets.MY_CHAT_ID }}
          VUELTA: ${{ github.event.inputs.vuelta || '1' }}
          BT_MAX_MIN: "300"
          BETS_GAP: "2.5"
        run: python mb_historico.py

      - name: Guardar descargas
        if: always()
        uses: actions/cache/save@v4
        with:
          path: resultados_12m/${{ env.SLUG }}/cache
          key: h12c-${{ env.SLUG }}-${{ github.run_id }}

      - name: Guardar resultados en el repositorio
        if: always()
        run: |
          git config user.name "tt-multiliga"
          git config user.email "tt-multiliga@users.noreply.github.com"
          git add resultados_12m/${{ env.SLUG }}/*.txt resultados_12m/${{ env.SLUG }}/*.csv 2>/dev/null || true
          git commit -m "Simulacion 12 meses ${{ env.SLUG }}" || echo "sin cambios"
          for i in 1 2 3; do git pull --rebase -X theirs && git push && break; sleep 5; done || true

      - name: Relanzar si falta terminar
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          MY_CHAT_ID: ${{ secrets.MY_CHAT_ID }}
        run: |
          V=${{ github.event.inputs.vuelta || '1' }}
          if [ -f resultados_12m/${{ env.SLUG }}/INCOMPLETO ] || [ "${{ job.status }}" != "success" ]; then
            if [ "$V" -lt 6 ]; then
              gh workflow run historico.yml --ref main -R "${{ github.repository }}" \
                -f liga="${{ github.event.inputs.liga }}" -f vuelta=$((V+1))
            elif [ -n "$TELEGRAM_TOKEN" ]; then
              curl -s "https://api.telegram.org/bot${TELEGRAM_TOKEN}/sendMessage" \
                --data-urlencode "chat_id=${MY_CHAT_ID}" \
                --data-urlencode "text=⚠️ La simulación de 12 meses de ${{ github.event.inputs.liga }} no ha podido terminar en 6 vueltas. Avisa a Claude." > /dev/null
            fi
          fi
