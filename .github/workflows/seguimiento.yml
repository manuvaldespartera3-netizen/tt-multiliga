name: Seguimiento TT Cup

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

concurrency:
  group: seguimiento
  cancel-in-progress: false

permissions:
  contents: write
  actions: write      # para lanzar la siguiente vuelta

jobs:
  seguir:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      # La siguiente vuelta se deja en cola NADA MAS EMPEZAR: si esta vuelta se
      # cuelga o falla, la siguiente arranca igual y la cadena no se rompe.
      - name: Dejar en cola la siguiente vuelta
        env:
          GH_TOKEN: ${{ github.token }}
        # Se lanza SIEMPRE (sin mirar si ya hay otra): GitHub solo deja una en espera
        # y descarta las sobrantes, asi que nunca se acumulan y la cadena no se corta.
        run: |
          for i in 1 2 3 4 5; do
            if gh workflow run seguimiento.yml --ref main -R "${{ github.repository }}"; then
              echo "siguiente vuelta en cola"; break
            fi
            echo "no se pudo lanzar (intento $i), reintento"
            sleep 15
          done || true

      # siempre la version mas reciente de main, con el picks.csv al dia
      - uses: actions/checkout@v4
        with:
          ref: main

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar numpy
        run: pip install numpy

      # dias ya terminados: se descargan una vez y se guardan
      - name: Recuperar historico
        uses: actions/cache/restore@v4
        with:
          path: |
            seguimiento/cache
            seguimiento/cache_19041
            seguimiento/cache_b15005
            seguimiento/cache_b19041
          key: segb-${{ github.run_id }}
          restore-keys: |
            segb-
            seg-

      # Liga Pro va en su propia copia (asi no se mezcla con la de TT Cup y Elite)
      - name: Recuperar historico de Liga Pro
        uses: actions/cache/restore@v4
        with:
          path: seguimiento/cache_b19039
          key: segl-${{ github.run_id }}
          restore-keys: segl-

      # Liga Pro: la primera vez, el historico se copia de la simulacion de 12 meses
      # (ya descargado), asi no hay que volver a bajarlo de BetsAPI
      - name: Mirar historico de Liga Pro
        id: lp
        run: |
          n=$(ls seguimiento/cache_b19039 2>/dev/null | wc -l)
          echo "n=$n" >> $GITHUB_OUTPUT

      - name: Recuperar historico de Liga Pro (simulacion)
        if: steps.lp.outputs.n < 100
        uses: actions/cache/restore@v4
        continue-on-error: true
        with:
          path: resultados_12m/czech_liga_pro/cache
          key: h12c-czech_liga_pro-ninguna
          restore-keys: h12c-czech_liga_pro-

      - name: Copiar historico de Liga Pro
        if: steps.lp.outputs.n < 100
        run: |
          mkdir -p seguimiento/cache_b19039
          cp -n resultados_12m/czech_liga_pro/cache/20*.json seguimiento/cache_b19039/ 2>/dev/null || true
          rm -rf resultados_12m/czech_liga_pro/cache
          echo "dias copiados: $(ls seguimiento/cache_b19039 | wc -l)"

      - name: Seguimiento
        id: seg
        env:
          ZYLA_API_KEY: ${{ secrets.ZYLA_API_KEY }}
          # datos de BetsAPI (Zyla ya no da los partidos por jugar ni las cuotas)
          FUENTE_DATOS: "betsapi"
          BETSAPI_TOKEN: ${{ secrets.BETSAPI_TOKEN }}
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_TOKEN_ELITE: ${{ secrets.TELEGRAM_TOKEN_ELITE }}
          TELEGRAM_TOKEN_LP: ${{ secrets.TELEGRAM_TOKEN_RATING }}
          MY_CHAT_ID: ${{ secrets.MY_CHAT_ID }}
          RUN_MIN: "14"
        run: python mb_seguimiento.py

      # solo se guarda una copia nueva cuando entra un dia nuevo al historico
      - name: Guardar historico
        if: always()
        uses: actions/cache/save@v4
        continue-on-error: true
        with:
          path: |
            seguimiento/cache
            seguimiento/cache_19041
            seguimiento/cache_b15005
            seguimiento/cache_b19041
          key: segb-${{ hashFiles('seguimiento/cache/*.json', 'seguimiento/cache_19041/*.json', 'seguimiento/cache_b15005/*.json', 'seguimiento/cache_b19041/*.json') }}

      - name: Guardar historico de Liga Pro
        if: always()
        uses: actions/cache/save@v4
        continue-on-error: true
        with:
          path: seguimiento/cache_b19039
          key: segl-${{ hashFiles('seguimiento/cache_b19039/*.json') }}

      - name: Guardar picks
        if: always()
        run: |
          if [ -n "$(git status --porcelain seguimiento/picks.csv seguimiento/estado.json)" ]; then
            git config user.name "tt-multiliga"
            git config user.email "tt-multiliga@users.noreply.github.com"
            git add seguimiento/picks.csv seguimiento/estado.json
            git commit -m "Seguimiento TT Cup"
            if ! git pull --rebase; then
              git rebase --abort || true
              git pull --no-rebase --no-edit -X ours || true
            fi
            git push || true
          fi

      # Red de seguridad: si por lo que sea no quedo ninguna en cola, lanzarla ahora
      - name: Comprobar que queda la siguiente vuelta
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "${{ steps.seg.outcome }}" != "success" ]; then sleep 120; fi
          for i in 1 2 3 4 5; do
            if gh workflow run seguimiento.yml --ref main -R "${{ github.repository }}"; then
              echo "siguiente vuelta en cola"; break
            fi
            echo "no se pudo lanzar (intento $i), reintento"
            sleep 15
          done || true


