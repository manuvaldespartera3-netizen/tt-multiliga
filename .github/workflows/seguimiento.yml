name: Seguimiento TT Cup

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

concurrency:
  group: seguimiento
  cancel-in-progress: false

permissions:
  contents: write
  actions: write      # para lanzar la siguiente vuelta

jobs:
  seguir:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      # La siguiente vuelta se deja en cola NADA MAS EMPEZAR: si esta vuelta se
      # cuelga o falla, la siguiente arranca igual y la cadena no se rompe.
      - name: Dejar en cola la siguiente vuelta
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for i in 1 2 3; do
            n=$(gh run list -R "${{ github.repository }}" --workflow seguimiento.yml --status queued --json databaseId -q 'length' 2>/dev/null || echo 0)
            p=$(gh run list -R "${{ github.repository }}" --workflow seguimiento.yml --status pending --json databaseId -q 'length' 2>/dev/null || echo 0)
            if [ "$n" != "0" ] || [ "$p" != "0" ]; then echo "ya hay una en cola"; break; fi
            gh workflow run seguimiento.yml --ref main -R "${{ github.repository }}" && break
            sleep 10
          done || true

      # siempre la version mas reciente de main, con el picks.csv al dia
      - uses: actions/checkout@v4
        with:
          ref: main

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar numpy
        run: pip install numpy

      # dias ya terminados: se descargan una vez y se guardan
      - name: Recuperar historico
        uses: actions/cache/restore@v4
        with:
          path: |
            seguimiento/cache
            seguimiento/cache_19041
          key: seg-${{ github.run_id }}
          restore-keys: seg-

      - name: Seguimiento
        id: seg
        env:
          ZYLA_API_KEY: ${{ secrets.ZYLA_API_KEY }}
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_TOKEN_ELITE: ${{ secrets.TELEGRAM_TOKEN_ELITE }}
          MY_CHAT_ID: ${{ secrets.MY_CHAT_ID }}
          RUN_MIN: "14"
        run: python mb_seguimiento.py

      # solo se guarda una copia nueva cuando entra un dia nuevo al historico
      - name: Guardar historico
        if: always()
        uses: actions/cache/save@v4
        continue-on-error: true
        with:
          path: |
            seguimiento/cache
            seguimiento/cache_19041
          key: seg-${{ hashFiles('seguimiento/cache/*.json', 'seguimiento/cache_19041/*.json') }}

      - name: Guardar picks
        if: always()
        run: |
          if [ -n "$(git status --porcelain seguimiento/picks.csv seguimiento/estado.json)" ]; then
            git config user.name "tt-multiliga"
            git config user.email "tt-multiliga@users.noreply.github.com"
            git add seguimiento/picks.csv seguimiento/estado.json
            git commit -m "Seguimiento TT Cup"
            if ! git pull --rebase; then
              git rebase --abort || true
              git pull --no-rebase --no-edit -X ours || true
            fi
            git push || true
          fi

      # Red de seguridad: si por lo que sea no quedo ninguna en cola, lanzarla ahora
      - name: Comprobar que queda la siguiente vuelta
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "${{ steps.seg.outcome }}" != "success" ]; then sleep 120; fi
          n=$(gh run list -R "${{ github.repository }}" --workflow seguimiento.yml --status queued --json databaseId -q 'length' 2>/dev/null || echo 0)
          p=$(gh run list -R "${{ github.repository }}" --workflow seguimiento.yml --status pending --json databaseId -q 'length' 2>/dev/null || echo 0)
          if [ "$n" = "0" ] && [ "$p" = "0" ]; then
            gh workflow run seguimiento.yml --ref main -R "${{ github.repository }}" || true
          fi
